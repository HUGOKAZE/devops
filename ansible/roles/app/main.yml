
- name: 🎯 Le rôle {{ role_name }} démarre
  debug:
    msg: "Le rôle {{ role_name }} a bien été inclus"

- name: Copier le fichier docker-compose.yml
  copy:
    src: "{{ playbook_dir }}/../update1/docker-compose.yml"
    dest: /opt/myapp/docker-compose.yml
    owner: devops-deploy
    group: devops-deploy
    mode: '0644'


- name: Lancer l'application avec Docker Compose
  command: docker-compose up -d
  args:
    chdir: /opt/myapp/
  register: result
  failed_when: "'read-only file system' in result.stderr"
  
